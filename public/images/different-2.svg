<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, 'IBM Plex Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD38A"/><stop offset=".55" stop-color="#F09A1A"/><stop offset="1" stop-color="#8A4B00"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3">
    <circle cx="400" cy="300" r="170"/><circle cx="400" cy="300" r="240"/><circle cx="400" cy="300" r="310"/>
  </g>
  <!-- bell -->
  <g transform="translate(610 120) rotate(14)">
    <circle r="62" fill="#0B1A36"/>
    <path d="M-24 18v-20a24 24 0 0 1 48 0v20l8 8h-64z" fill="#FFB547"/><circle cy="34" r="7" fill="#FFB547"/>
  </g>
  <!-- phone -->
  <rect x="265" y="40" width="270" height="560" rx="42" fill="#0B1A36"/>
  <rect x="279" y="54" width="242" height="546" rx="32" fill="#14284D"/>
  <rect x="360" y="66" width="80" height="18" rx="9" fill="#0B1A36"/>
  <text x="400" y="140" font-size="44" font-weight="300" fill="#fff" text-anchor="middle">Market</text>
  <text x="400" y="168" font-size="14" fill="#B9C9E6" text-anchor="middle">Alerts on Telegram</text>
  <!-- notification 1: before -->
  <g transform="translate(222 205)">
    <rect width="356" height="104" rx="22" fill="#fff"/>
    <circle cx="40" cy="38" r="20" fill="#1A5FD0"/><path d="M31 38l18-9-6 20-4-7z" fill="#fff"/>
    <text x="72" y="34" font-size="14" font-weight="700" fill="#0B1A36">MarkIQ SI</text>
    <text x="300" y="34" font-size="12" fill="#5A6780">soon</text>
    <text x="72" y="58" font-size="15" fill="#0B1A36">High-impact news is coming up</text>
    <rect x="72" y="72" width="78" height="20" rx="10" fill="#FFE7C2"/><text x="111" y="86" font-size="11" font-weight="700" fill="#8A4B00" text-anchor="middle">BEFORE</text>
  </g>
  <!-- notification 2: after -->
  <g transform="translate(238 328)">
    <rect width="356" height="104" rx="22" fill="#fff"/>
    <circle cx="40" cy="38" r="20" fill="#1A5FD0"/><path d="M31 38l18-9-6 20-4-7z" fill="#fff"/>
    <text x="72" y="34" font-size="14" font-weight="700" fill="#0B1A36">MarkIQ SI</text>
    <text x="300" y="34" font-size="12" fill="#5A6780">now</text>
    <text x="72" y="58" font-size="15" fill="#0B1A36">The result is out. Here is</text>
    <text x="72" y="78" font-size="15" fill="#0B1A36">what it means for the market.</text>
  </g>
  <g transform="translate(560 318)"><rect width="72" height="22" rx="11" fill="#3DDC97"/><text x="36" y="15" font-size="11" font-weight="700" fill="#0B1A36" text-anchor="middle">AFTER</text></g>
  <rect x="300" y="460" width="200" height="10" rx="5" fill="#2B4A82"/><rect x="300" y="482" width="160" height="10" rx="5" fill="#2B4A82"/>
</svg>
